<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>モンスター迎撃ゲーム | CC0モンスター・動物 3Dモデル集</title>
<style>
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; overflow:hidden; background:#0b1020; font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif; color:#eef2f8; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; top:0; left:0; right:0; display:flex; gap:14px; align-items:center; padding:10px 14px; pointer-events:none; z-index:5; }
  .hud .box { background:rgba(10,16,30,.72); border:1px solid rgba(255,255,255,.18); border-radius:10px; padding:6px 12px; font-size:15px; }
  .hud b { font-size:18px; }
  .hud .spacer { flex:1; }
  .hud a { pointer-events:auto; color:#cfe1ff; text-decoration:none; background:rgba(10,16,30,.72); border:1px solid rgba(255,255,255,.18); border-radius:10px; padding:8px 12px; font-size:14px; }
  #fireBtn { position:fixed; right:18px; bottom:22px; width:96px; height:96px; border-radius:50%; border:2px solid rgba(255,255,255,.35); background:rgba(200,50,40,.75); color:#fff; font-size:19px; font-weight:700; z-index:6; touch-action:none; }
  #fireBtn:active { background:rgba(230,70,55,.95); }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(6,10,22,.68); z-index:10; text-align:center; padding:20px; }
  .overlay h1 { font-size:30px; }
  .overlay p { line-height:1.7; color:#c8d4e6; max-width:560px; }
  .bigbtn { font-size:18px; font-weight:700; padding:14px 34px; border-radius:12px; border:none; background:#2563eb; color:#fff; cursor:pointer; }
  .bigbtn:disabled { background:#44506a; cursor:wait; }
  #loadbar { width:min(420px,80vw); height:10px; background:#26314a; border-radius:99px; overflow:hidden; }
  #loadfill { height:100%; width:0%; background:#4f8cff; transition:width .2s; }
  .hidden { display:none !important; }
  #toast { position:fixed; left:50%; bottom:130px; transform:translateX(-50%); font-size:22px; font-weight:700; color:#ffd76a; text-shadow:0 2px 8px #000; z-index:5; pointer-events:none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div class="box">スコア <b id="score">0</b></div>
  <div class="box">ウェーブ <b id="wave">1</b></div>
  <div class="box">拠点 <b id="base">10</b></div>
  <div class="spacer"></div>
  <a href="./">← モデル集に戻る</a>
</div>
<div id="toast"></div>
<button id="fireBtn">撃つ</button>

<div class="overlay" id="startScr">
  <h1>モンスター迎撃ゲーム</h1>
  <p>CC0のモンスターたちが攻めてきます。大砲で迎え撃ってください。<br>
  狙い: マウス移動／ドラッグ　発射: クリック長押し・スペース・「撃つ」ボタン<br>
  モデル読み込みに約75MB使います（Wi-Fi推奨）。全部このサイト収録のCC0モデルです。</p>
  <div id="loadbar"><div id="loadfill"></div></div>
  <p id="loadmsg">読み込み中…</p>
  <button class="bigbtn" id="startBtn" disabled>スタート</button>
</div>

<div class="overlay hidden" id="overScr">
  <h1>拠点が落ちました</h1>
  <p id="finalScore"></p>
  <button class="bigbtn" id="retryBtn">もう一度</button>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const ROSTER = [
  // rigged (walk/runアニメ付き)
  { slug:'werewolf',        url:'files/grab3d/werewolf/rigged/werewolf-rigged.glb',                 rigged:true,  hp:4, height:3.4, score:150 },
  { slug:'yeti',            url:'files/grab3d/yeti/rigged/yeti-rigged.glb',                         rigged:true,  hp:4, height:3.4, score:150 },
  { slug:'stone-golem',     url:'files/grab3d/stone-golem/rigged/stone-golem-rigged.glb',           rigged:true,  hp:6, height:3.8, score:200 },
  { slug:'stylized-zombie', url:'files/grab3d/stylized-zombie/rigged/stylized-zombie-rigged.glb',   rigged:true,  hp:3, height:3.2, score:120 },
  // static (プレビューGLB、手続きアニメで動かす)
  { slug:'crystal-dragon',  url:'files/grab3d/crystal-dragon/preview.glb',  rigged:false, hp:3, height:3.6, score:120 },
  { slug:'horror-monster',  url:'files/grab3d/horror-monster/preview.glb',  rigged:false, hp:3, height:3.4, score:120 },
  { slug:'hydra',           url:'files/grab3d/hydra/preview.glb',           rigged:false, hp:4, height:3.8, score:150 },
  { slug:'kraken',          url:'files/grab3d/kraken/preview.glb',          rigged:false, hp:4, height:3.6, score:150 },
  { slug:'griffin',         url:'files/grab3d/griffin/preview.glb',         rigged:false, hp:2, height:3.0, score:100 },
  { slug:'phoenix',         url:'files/grab3d/phoenix/preview.glb',         rigged:false, hp:2, height:3.0, score:100, fly:true },
  { slug:'t-rex',           url:'files/grab3d/t-rex/preview.glb',           rigged:false, hp:4, height:3.8, score:150 },
  { slug:'low-poly-dragon', url:'files/grab3d/low-poly-dragon/low-poly-dragon.glb', rigged:false, hp:1, height:2.2, score:60, fly:true },
  { slug:'gargoyle',        url:'files/grab3d/gargoyle/gargoyle.glb',       rigged:false, hp:2, height:2.6, score:80 },
  { slug:'mimic-chest',     url:'files/grab3d/mimic-chest/mimic-chest.glb', rigged:false, hp:1, height:1.6, score:60 },
];

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a6c8);
scene.fog = new THREE.Fog(0x87a6c8, 55, 130);
const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 8.5, 26);
camera.lookAt(0, 2.5, -20);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
app.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdfeaff, 0x445533, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(18, 30, 12); sun.castShadow = true;
sun.shadow.camera.left=-40; sun.shadow.camera.right=40; sun.shadow.camera.top=40; sun.shadow.camera.bottom=-40;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 130), new THREE.MeshStandardMaterial({ color:0x5d7d4a, roughness:1 }));
ground.rotation.x = -Math.PI/2; ground.position.z = -38; ground.receiveShadow = true;
scene.add(ground);
const lane = new THREE.Mesh(new THREE.PlaneGeometry(40, 130), new THREE.MeshStandardMaterial({ color:0x77694f, roughness:1 }));
lane.rotation.x = -Math.PI/2; lane.position.set(0, 0.01, -38); lane.receiveShadow = true;
scene.add(lane);
// 拠点ライン
const wall = new THREE.Mesh(new THREE.BoxGeometry(42, 1.6, 1.2), new THREE.MeshStandardMaterial({ color:0x8a8f98, roughness:.8 }));
wall.position.set(0, 0.8, 11); wall.castShadow = true; scene.add(wall);

// ---- 大砲 ----
const cannon = new THREE.Group();
const cbase = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.9, 1.0, 20), new THREE.MeshStandardMaterial({ color:0x39404d, roughness:.6, metalness:.4 }));
cbase.position.y = 0.5; cbase.castShadow = true; cannon.add(cbase);
const pivot = new THREE.Group(); pivot.position.y = 1.15; cannon.add(pivot);
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.55, 3.6, 16), new THREE.MeshStandardMaterial({ color:0x22262e, roughness:.45, metalness:.6 }));
barrel.rotation.x = Math.PI/2; barrel.position.z = -1.5; barrel.castShadow = true; pivot.add(barrel);
const muzzleTip = new THREE.Object3D(); muzzleTip.position.set(0, 0, -3.4); pivot.add(muzzleTip);
cannon.position.set(0, 0, 15.5);
scene.add(cannon);

// ---- 音（簡易シンセ） ----
let AC = null;
function beep(freq, dur, type='square', vol=0.12, slide=0){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq+slide), AC.currentTime+dur);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

// ---- モデル読み込み ----
const loader = new GLTFLoader();
const templates = [];
let loadedCount = 0;
async function loadAll(){
  for(const r of ROSTER){
    try{
      const g = await loader.loadAsync(r.url);
      templates.push({ ...r, scene:g.scene, animations:g.animations });
    }catch(e){ console.warn('load failed', r.slug, e); }
    loadedCount++;
    document.getElementById('loadfill').style.width = (loadedCount/ROSTER.length*100)+'%';
    document.getElementById('loadmsg').textContent = `読み込み中… ${loadedCount}/${ROSTER.length}`;
  }
  document.getElementById('loadmsg').textContent = '準備完了';
  document.getElementById('startBtn').disabled = false;
}
loadAll();

// ---- ゲーム状態 ----
let playing=false, score=0, wave=1, baseHp=10, elapsed=0, spawnTimer=0, kills=0;
const monsters=[], balls=[], shards=[];
const ballGeo = new THREE.SphereGeometry(0.34, 12, 10);
const ballMat = new THREE.MeshStandardMaterial({ color:0x1c1e24, roughness:.4, metalness:.5 });
const shardGeo = new THREE.TetrahedronGeometry(0.22);

function toast(txt){
  const t=document.getElementById('toast'); t.textContent=txt;
  t.style.opacity=1; setTimeout(()=>t.style.opacity=0, 700);
}
function spawnMonster(){
  if(!templates.length) return;
  const tpl = templates[Math.floor(Math.random()*templates.length)];
  let obj, mixer=null;
  if(tpl.rigged){
    obj = SkeletonUtils.clone(tpl.scene);
    mixer = new THREE.AnimationMixer(obj);
    const clip = tpl.animations.find(a=>a.name==='walk') || tpl.animations[0];
    if(clip){ const act = mixer.clipAction(clip); act.play(); }
  } else {
    obj = tpl.scene.clone(true);
  }
  // 正規化: 高さを tpl.height に合わせ、足元を y=0 に
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3(); box.getSize(size);
  const s = tpl.height / Math.max(size.y, 0.001);
  obj.scale.setScalar(s);
  const box2 = new THREE.Box3().setFromObject(obj);
  obj.position.y -= box2.min.y;
  const group = new THREE.Group();
  group.add(obj);
  const flyY = tpl.fly ? 2.2 + Math.random()*1.2 : 0;
  group.position.set((Math.random()*2-1)*15, flyY, -88 - Math.random()*10);
  group.rotation.y = 0; // glTFの正面は+Z（進行方向）
  obj.traverse(o=>{ if(o.isMesh){ o.castShadow=true; } });
  scene.add(group);
  const speedBase = tpl.rigged ? 2.6 : 2.1;
  monsters.push({ group, obj, mixer, tpl, hp:tpl.hp, flyY,
    speed:(speedBase + Math.random()*1.1) * (1 + (wave-1)*0.07),
    phase:Math.random()*Math.PI*2, dead:0, radius:tpl.height*0.42 });
  if(mixer) mixer.timeScale = 1;
}
function burst(pos, color, n=14, power=5){
  for(let i=0;i<n;i++){
    const m = new THREE.Mesh(shardGeo, new THREE.MeshStandardMaterial({ color, roughness:.7 }));
    m.position.copy(pos);
    m.userData.v = new THREE.Vector3((Math.random()-0.5)*power, Math.random()*power*0.9+1.5, (Math.random()-0.5)*power);
    m.userData.life = 0.8 + Math.random()*0.4;
    scene.add(m); shards.push(m);
  }
}
let firing=false, cooldown=0;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(0, 0.1);
const aimPlane = new THREE.Plane(new THREE.Vector3(0,0,1), 30); // z=-30 の面
const aimPoint = new THREE.Vector3(0, 2, -30);
const _m = new THREE.Matrix4();
function updateAim(){
  raycaster.setFromCamera(pointer, camera);
  const p = new THREE.Vector3();
  if(raycaster.ray.intersectPlane(aimPlane, p)) aimPoint.copy(p);
  // 砲身は pivot の -Z 方向。Matrix4.lookAt(eye=砲, target=狙点) は +Z を狙点の反対へ向けるので、-Z が狙点を向く
  const from = pivot.getWorldPosition(new THREE.Vector3());
  _m.lookAt(from, aimPoint, new THREE.Vector3(0,1,0));
  pivot.quaternion.setFromRotationMatrix(_m);
}
function shoot(){
  if(cooldown>0 || !playing) return;
  cooldown = 0.32;
  const ball = new THREE.Mesh(ballGeo, ballMat);
  const from = muzzleTip.getWorldPosition(new THREE.Vector3());
  ball.position.copy(from);
  const dir = aimPoint.clone().sub(from).normalize();
  ball.userData.v = dir.multiplyScalar(78);
  scene.add(ball); balls.push(ball);
  beep(140, 0.18, 'square', 0.15, -80);
}
addEventListener('pointermove', e=>{
  pointer.x = (e.clientX/innerWidth)*2-1;
  pointer.y = -(e.clientY/innerHeight)*2+1;
});
addEventListener('pointerdown', e=>{ if(playing && e.target.id!=='fireBtn'){ firing=true; shoot(); } });
addEventListener('pointerup', ()=> firing=false);
addEventListener('keydown', e=>{ if(e.code==='Space'){ firing=true; shoot(); e.preventDefault(); } });
addEventListener('keyup', e=>{ if(e.code==='Space') firing=false; });
const fireBtn = document.getElementById('fireBtn');
fireBtn.addEventListener('pointerdown', e=>{ firing=true; shoot(); e.preventDefault(); });
fireBtn.addEventListener('pointerup', ()=> firing=false);
fireBtn.addEventListener('pointerleave', ()=> firing=false);

function resetGame(){
  for(const m of monsters){ scene.remove(m.group); }
  for(const b of balls){ scene.remove(b); }
  for(const s of shards){ scene.remove(s); }
  monsters.length=0; balls.length=0; shards.length=0;
  score=0; wave=1; baseHp=10; elapsed=0; spawnTimer=0; kills=0; cooldown=0;
  syncHud();
}
function syncHud(){
  document.getElementById('score').textContent = score;
  document.getElementById('wave').textContent = wave;
  document.getElementById('base').textContent = baseHp;
}
function gameOver(){
  playing=false;
  document.getElementById('finalScore').textContent = `スコア ${score}（${kills}体撃破・ウェーブ${wave}まで）`;
  document.getElementById('overScr').classList.remove('hidden');
}
document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('startScr').classList.add('hidden');
  resetGame(); playing=true; beep(520,0.12,'triangle',0.1);
});
document.getElementById('retryBtn').addEventListener('click', ()=>{
  document.getElementById('overScr').classList.add('hidden');
  resetGame(); playing=true;
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if(playing){
    elapsed += dt;
    wave = 1 + Math.floor(elapsed/25);
    cooldown -= dt;
    if(firing) shoot();
    spawnTimer -= dt;
    const interval = Math.max(0.9, 2.6 - wave*0.22);
    if(spawnTimer<=0 && monsters.filter(m=>!m.dead).length < 11){ spawnMonster(); spawnTimer = interval * (0.7+Math.random()*0.6); }
    // モンスター移動
    for(let i=monsters.length-1;i>=0;i--){
      const m = monsters[i];
      if(m.dead){
        m.dead += dt;
        m.group.rotation.x = -Math.min(Math.PI/2, m.dead*2.2);
        m.group.position.y = (m.flyY||0) - m.dead*1.4;
        if(m.dead>0.9){ scene.remove(m.group); monsters.splice(i,1); }
        continue;
      }
      if(m.mixer) m.mixer.update(dt);
      m.group.position.z += m.speed*dt;
      if(!m.tpl.rigged){
        m.group.position.y = (m.flyY||0) + Math.sin(t*3 + m.phase)*0.18;
        m.group.rotation.z = Math.sin(t*2.2 + m.phase)*0.06;
      }
      if(m.group.position.z >= 10.2){
        scene.remove(m.group); monsters.splice(i,1);
        baseHp--; syncHud(); beep(90, 0.3, 'sawtooth', 0.16, -40);
        toast('拠点に到達された！');
        if(baseHp<=0) gameOver();
      }
    }
    // 砲弾
    for(let i=balls.length-1;i>=0;i--){
      const b = balls[i];
      b.position.addScaledVector(b.userData.v, dt);
      let hit=false;
      for(const m of monsters){
        if(m.dead) continue;
        const c = m.group.position.clone(); c.y += m.tpl.height*0.5;
        if(b.position.distanceTo(c) < m.radius + 0.5){
          hit=true; m.hp--;
          burst(b.position, 0xffa53a, 10, 4);
          beep(300, 0.08, 'square', 0.1, 120);
          if(m.hp<=0){
            m.dead = 0.0001; score += m.tpl.score; kills++;
            burst(c, 0xd94f3a, 22, 6.5);
            beep(520, 0.22, 'triangle', 0.14, -300);
            toast('+'+m.tpl.score);
          } else {
            m.group.position.z -= 0.7;
          }
          syncHud();
          break;
        }
      }
      if(hit || b.position.z < -120 || b.position.y < -2 || Math.abs(b.position.x) > 80){
        scene.remove(b); balls.splice(i,1);
      }
    }
    syncHud();
  }
  // 破片
  for(let i=shards.length-1;i>=0;i--){
    const s = shards[i];
    s.userData.life -= dt;
    s.userData.v.y -= 12*dt;
    s.position.addScaledVector(s.userData.v, dt);
    s.rotation.x += dt*6; s.rotation.y += dt*5;
    if(s.userData.life<=0 || s.position.y<0){ scene.remove(s); shards.splice(i,1); }
  }
  updateAim();
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
