<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迎撃ゲーム | CC0モンスター置き場</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;gap:16px;align-items:center;padding:10px 14px;color:#fff;pointer-events:none;z-index:5;flex-wrap:wrap}
  .hud .box{background:rgba(10,14,28,.65);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 12px;font-size:15px}
  .hud b{font-size:19px}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:6;background:rgba(5,8,18,.45);padding:20px}
  #msg h1{font-size:clamp(24px,5vw,42px);margin:0}
  #msg p{max-width:560px;line-height:1.7;margin:0;color:#dbe4ff}
  .btn{pointer-events:auto;background:#e0452c;color:#fff;border:none;border-radius:999px;padding:13px 30px;font-size:17px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:wait}
  #fire{position:fixed;right:18px;bottom:18px;z-index:5;width:92px;height:92px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(224,69,44,.85);color:#fff;font-size:17px;font-weight:700;display:none;touch-action:none}
  #cross{position:fixed;z-index:4;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;color:#ffd34d;font-size:30px;line-height:34px;text-align:center;text-shadow:0 0 6px #000}
  a.back{position:fixed;left:14px;bottom:14px;z-index:5;color:#cdd8ff;background:rgba(10,14,28,.65);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 14px;text-decoration:none;font-size:14px}
  @media (pointer:coarse){ #fire{display:block} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div class="box">スコア <b id="score">0</b></div>
  <div class="box">ウェーブ <b id="wave">1</b></div>
  <div class="box">拠点HP <b id="hp">10</b></div>
  <div class="box" id="loadbox">読み込み中…</div>
</div>
<div id="cross">＋</div>
<button id="fire">撃つ</button>
<a class="back" href="./">← 一覧へもどる</a>
<div id="msg">
  <h1>モンスター迎撃ゲーム</h1>
  <p>CC0モンスターたちが攻めてきます。マウス（ドラッグ）で狙って、クリック長押しで連射。スマホは右下の「撃つ」ボタンです。拠点HPが0になるとゲームオーバー。</p>
  <p id="loadmsg">モデルを読み込んでいます…</p>
  <button class="btn" id="start" disabled>読み込み中…</button>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';

// フォールバック（game_roster.json が読めないときの最小ロスター）
const FALLBACK = [
  { url:'files/grab3d/werewolf/rigged/werewolf-rigged.glb', rigged:true, fly:false, h:3.4, hp:3, score:250 },
  { url:'files/grab3d/yeti/rigged/yeti-rigged.glb', rigged:true, fly:false, h:3.4, hp:3, score:250 },
  { url:'files/grab3d/stone-golem/rigged/stone-golem-rigged.glb', rigged:true, fly:false, h:3.6, hp:4, score:300 },
  { url:'files/grab3d/stylized-zombie/rigged/stylized-zombie-rigged.glb', rigged:true, fly:false, h:3.2, hp:2, score:200 },
  { url:'files/grab3d/crystal-dragon/preview.glb', rigged:false, fly:true, h:3.2, hp:3, score:250 },
  { url:'files/grab3d/phoenix/preview.glb', rigged:false, fly:true, h:2.6, hp:2, score:200 },
  { url:'files/grab3d/low-poly-dragon/low-poly-dragon.glb', rigged:false, fly:true, h:2.4, hp:2, score:200 },
  { url:'files/grab3d/hydra/preview.glb', rigged:false, fly:false, h:3.4, hp:3, score:250 },
  { url:'files/grab3d/t-rex/preview.glb', rigged:false, fly:false, h:3.4, hp:3, score:250 },
  { url:'files/grab3d/mimic-chest/mimic-chest.glb', rigged:false, fly:false, h:2.0, hp:1, score:150 },
];

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 55, 130);
const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 8.5, 26);
camera.lookAt(0, 3, -20);

scene.add(new THREE.HemisphereLight(0xbcd2ff, 0x2a2118, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(14, 26, 10);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 220),
  new THREE.MeshStandardMaterial({ color:0x1d2b1d, roughness:1 })
);
ground.rotation.x = -Math.PI/2;
ground.position.z = -60;
scene.add(ground);
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(17, 220),
  new THREE.MeshStandardMaterial({ color:0x3a3f4a, roughness:1 })
);
road.rotation.x = -Math.PI/2;
road.position.set(0, 0.01, -60);
scene.add(road);

// 大砲
const cannon = new THREE.Group();
const base = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.9, 1.0, 20), new THREE.MeshStandardMaterial({ color:0x555f73, roughness:.6, metalness:.4 }));
base.position.y = 0.5;
cannon.add(base);
const barrelPivot = new THREE.Group();
barrelPivot.position.set(0, 1.15, 0);
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.44, 3.4, 16), new THREE.MeshStandardMaterial({ color:0x39415a, roughness:.4, metalness:.6 }));
barrel.rotation.x = Math.PI/2;
barrel.position.z = 1.2;
barrelPivot.add(barrel);
cannon.add(barrelPivot);
cannon.position.set(0, 0, 15.5);
scene.add(cannon);
const muzzle = new THREE.Object3D();
muzzle.position.set(0, 0, 3.1);
barrelPivot.add(muzzle);

// 音（簡易シンセ）
let AC = null;
function beep(freq, dur, type='square', vol=0.12){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g).connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}

// ロスター読み込み
const gltfLoader = new GLTFLoader();
const fbxLoader = new FBXLoader();
const pool = [];
let loadTotal = 0, loadDone = 0;

async function loadSpec(spec){
  try{
    let obj, anims = [];
    if (spec.url.toLowerCase().endsWith('.fbx')){
      obj = await fbxLoader.loadAsync(spec.url);
      anims = obj.animations || [];
    } else {
      const g = await gltfLoader.loadAsync(spec.url);
      obj = g.scene; anims = g.animations || [];
    }
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    if (!isFinite(size.x) || size.length() === 0) throw new Error('empty');
    pool.push({ spec, proto: obj, anims, size, boxMin: box.min.clone() });
  }catch(e){ /* 読めないモデルは出撃させない */ }
  loadDone++;
  const lb = document.getElementById('loadbox');
  if (lb) lb.textContent = '登場モデル ' + pool.length + ' 種（読込 ' + loadDone + '/' + loadTotal + '）';
  const st = document.getElementById('start');
  if (pool.length >= 6 && st.disabled){
    st.disabled = false; st.textContent = 'ゲーム開始';
    document.getElementById('loadmsg').textContent = '準備できました。読み込みは裏で続きます（登場モデルは増えていきます）。';
  }
  if (loadDone >= loadTotal && lb) lb.textContent = '登場モデル ' + pool.length + ' 種';
}

async function loadRoster(){
  let roster = FALLBACK;
  try{
    const r = await fetch('game_roster.json');
    if (r.ok){ const j = await r.json(); if (Array.isArray(j) && j.length) roster = j; }
  }catch(e){}
  loadTotal = roster.length;
  let idx = 0;
  async function worker(){
    while (idx < roster.length){ const s = roster[idx++]; await loadSpec(s); }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
}

// ゲーム状態
let playing = false, score = 0, hp = 10, wave = 1, waveT = 0, spawnT = 0, cool = 0;
const monsters = [], balls = [], parts = [];
const ballGeo = new THREE.SphereGeometry(0.22, 10, 10);
const ballMat = new THREE.MeshBasicMaterial({ color:0xffd34d });
const partGeo = new THREE.BoxGeometry(0.16, 0.16, 0.16);

function spawnMonster(){
  if (!pool.length) return;
  const p = pool[Math.floor(Math.random()*pool.length)];
  const spec = p.spec;
  const obj = spec.rigged ? skeletonClone(p.proto) : p.proto.clone(true);
  const s = spec.h / p.size.y;
  obj.scale.setScalar(s);
  obj.position.y -= p.boxMin.y * s;
  const group = new THREE.Group();
  group.add(obj);
  const w = p.size.x * s, d = p.size.z * s;
  const proxy = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w,0.8)+0.5, spec.h+0.5, Math.max(d,0.8)+0.5),
                               new THREE.MeshBasicMaterial({ visible:false }));
  proxy.position.y = spec.h/2;
  group.add(proxy);
  const lane = (Math.random()*14 - 7);
  group.position.set(lane, spec.fly ? 2.1 + Math.random()*1.4 : 0, -78 - Math.random()*22);
  if (spec.rotY) group.rotation.y = spec.rotY;
  group.userData.baseRotY = spec.rotY || 0;
  scene.add(group);
  let mixer = null;
  if (p.anims && p.anims.length){
    mixer = new THREE.AnimationMixer(obj);
    const walk = p.anims.find(a => /walk/i.test(a.name)) || p.anims[0];
    mixer.clipAction(walk).play();
  }
  const m = { group, proxy, mixer, hp: spec.hp + Math.floor((wave-1)/2),
              speed: (2.1 + Math.random()*0.9 + wave*0.22) * (spec.fly ? 1.25 : 1),
              h: spec.h, hx: Math.max(w,0.8)/2 + 0.3, hz: Math.max(d,0.8)/2 + 0.3,
              fly: spec.fly, score: spec.score, t: Math.random()*10, baseY: group.position.y };
  proxy.userData.monster = m;
  monsters.push(m);
}

const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2(0, 0.1);
const aimPoint = new THREE.Vector3(0, 2.5, -30);
let firing = false;

function updateAim(){
  raycaster.setFromCamera(pointerNDC, camera);
  const proxies = [];
  for (const m of monsters) proxies.push(m.proxy);
  let hit = null;
  if (proxies.length) hit = raycaster.intersectObjects(proxies, false)[0];
  if (hit) aimPoint.copy(hit.point);
  else raycaster.ray.at(90, aimPoint);
  barrelPivot.lookAt(aimPoint);
  const cross = document.getElementById('cross');
  cross.style.left = ((pointerNDC.x+1)/2*innerWidth) + 'px';
  cross.style.top = ((-pointerNDC.y+1)/2*innerHeight) + 'px';
}

function setPointer(e){
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  pointerNDC.x = (x/innerWidth)*2 - 1;
  pointerNDC.y = -(y/innerHeight)*2 + 1;
}
addEventListener('pointermove', setPointer);
addEventListener('pointerdown', e => { setPointer(e); if (playing && e.target === renderer.domElement) firing = true; });
addEventListener('pointerup', () => firing = false);
addEventListener('keydown', e => { if (e.code === 'Space'){ firing = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (e.code === 'Space') firing = false; });
const fireBtn = document.getElementById('fire');
fireBtn.addEventListener('pointerdown', e => { firing = true; e.preventDefault(); });
fireBtn.addEventListener('pointerup', () => firing = false);
fireBtn.addEventListener('pointerleave', () => firing = false);

function shoot(){
  const mp = new THREE.Vector3();
  muzzle.getWorldPosition(mp);
  const dir = aimPoint.clone().sub(mp).normalize();
  const b = new THREE.Mesh(ballGeo, ballMat);
  b.position.copy(mp);
  b.userData.vel = dir.multiplyScalar(85);
  b.userData.life = 2.2;
  b.userData.prev = mp.clone();
  scene.add(b);
  balls.push(b);
  beep(160, 0.08, 'square', 0.07);
}

function burst(pos, color){
  for (let i = 0; i < 14; i++){
    const p = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({ color }));
    p.position.copy(pos);
    p.userData.vel = new THREE.Vector3((Math.random()-0.5)*9, Math.random()*8, (Math.random()-0.5)*9);
    p.userData.life = 0.7;
    scene.add(p);
    parts.push(p);
  }
}

function damage(m){
  m.hp--;
  burst(new THREE.Vector3(m.group.position.x, m.group.position.y + m.h*0.6, m.group.position.z), 0xffa53d);
  beep(320, 0.06, 'triangle', 0.09);
  if (m.hp <= 0){
    score += m.score;
    document.getElementById('score').textContent = score;
    burst(m.group.position.clone().setY(m.group.position.y + m.h*0.5), 0x7dff6a);
    beep(90, 0.25, 'sawtooth', 0.12);
    scene.remove(m.group);
    monsters.splice(monsters.indexOf(m), 1);
  }
}

function gameOver(){
  playing = false;
  const msg = document.getElementById('msg');
  msg.style.display = 'flex';
  msg.querySelector('h1').textContent = 'ゲームオーバー';
  document.getElementById('loadmsg').textContent = 'スコア ' + score + '（ウェーブ ' + wave + ' まで）';
  const st = document.getElementById('start');
  st.disabled = false; st.textContent = 'もう一度遊ぶ';
}

document.getElementById('start').addEventListener('click', () => {
  document.getElementById('msg').style.display = 'none';
  for (const m of monsters) scene.remove(m.group);
  monsters.length = 0;
  score = 0; hp = 10; wave = 1; waveT = 0; spawnT = 0;
  document.getElementById('score').textContent = '0';
  document.getElementById('wave').textContent = '1';
  document.getElementById('hp').textContent = '10';
  playing = true;
  beep(520, 0.1, 'square', 0.08);
});

const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateAim();
  if (playing){
    waveT += dt;
    if (waveT > 25){ waveT = 0; wave++; document.getElementById('wave').textContent = wave; }
    spawnT -= dt;
    const interval = Math.max(0.55, 1.5 - wave*0.12);
    if (spawnT <= 0 && monsters.length < 4 + wave*2){ spawnMonster(); spawnT = interval * (0.6 + Math.random()*0.7); }
    cool -= dt;
    if (firing && cool <= 0){ shoot(); cool = 0.30; }
  }
  for (let i = monsters.length-1; i >= 0; i--){
    const m = monsters[i];
    m.t += dt;
    if (m.mixer) m.mixer.update(dt);
    m.group.position.z += m.speed * dt;
    if (!m.mixer) m.group.position.y = m.baseY + Math.sin(m.t*2.2) * 0.16;
    m.group.rotation.y = m.group.userData.baseRotY + Math.sin(m.t*0.7) * 0.06;
    if (m.group.position.z >= 10.5){
      scene.remove(m.group);
      monsters.splice(i, 1);
      hp--;
      document.getElementById('hp').textContent = hp;
      beep(70, 0.3, 'sawtooth', 0.14);
      if (hp <= 0) gameOver();
    }
  }
  for (let i = balls.length-1; i >= 0; i--){
    const b = balls[i];
    b.userData.prev.copy(b.position);
    b.position.addScaledVector(b.userData.vel, dt);
    b.userData.life -= dt;
    const seg = b.position.clone().sub(b.userData.prev);
    const steps = Math.max(1, Math.ceil(seg.length()/0.4));
    let hitDone = false;
    for (let stp = 1; stp <= steps && !hitDone; stp++){
      const px = b.userData.prev.x + seg.x*stp/steps;
      const py = b.userData.prev.y + seg.y*stp/steps;
      const pz = b.userData.prev.z + seg.z*stp/steps;
      for (const m of monsters){
        const g = m.group.position;
        if (Math.abs(px-g.x) <= m.hx && Math.abs(pz-g.z) <= m.hz && py >= g.y-0.3 && py <= g.y + m.h + 0.3){
          damage(m); hitDone = true; break;
        }
      }
    }
    if (hitDone || b.userData.life <= 0 || b.position.y < 0){
      scene.remove(b);
      balls.splice(i, 1);
    }
  }
  for (let i = parts.length-1; i >= 0; i--){
    const p = parts[i];
    p.userData.life -= dt;
    p.userData.vel.y -= 18*dt;
    p.position.addScaledVector(p.userData.vel, dt);
    if (p.userData.life <= 0){ scene.remove(p); parts.splice(i, 1); }
  }
  renderer.render(scene, camera);
}
loop();
loadRoster();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
